on:
  workflow_dispatch:

name: Publish

# Required permissions for GitHub Pages direct deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Only allow one concurrent deployment to prevent conflicts
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # `make publish` renders the site and uploads it to the release, so the
      # data it is built from never reaches the runner.
      - name: Fetch the built site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download site --repo ${{ github.repository }} --pattern site.tar.gz
          mkdir _acuity
          tar -xzf site.tar.gz -C _acuity

      # Packages the _acuity output directory and uploads it to GitHub infrastructure
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _acuity
          retention-days: 1

      # Deploys the artifact to your live GitHub Pages URL
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
