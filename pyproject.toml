[project]
name = "thesis"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "dagster>=1.13.17",
    "dagster-dg-cli>=1.13.17",
    "dagster-webserver>=1.13.17",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "quarto-cli>=1.10.18",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "pipeline"
